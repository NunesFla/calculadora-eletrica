<!DOCTYPE html>
<html lang="pt-BR"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimensionamento Elétrico Profissional - NBR 5410</title>
    
   
    <link rel="manifest" href="manifest.json">
    
    
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Dim. Elétrico">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container"> 
    <header class="header"> 
        <h2>⚡ Dimensionamento Elétrico</h2>
        <p>CÁLCULO DE AMPERAGEM E CABOS - REF. NBR 5410</p>
    </header>
    
    <div class="form-group">
        <label for="tipo">Tipo de Carga</label>
        <select id="tipo" onchange="alternarCampos()">
            <option value="lampada">💡 Iluminação (Lâmpadas)</option>
            <option value="chuveiro">🚿 Chuveiro Elétrico</option>
            <option value="motor">⚙️ Motor Elétrico</option>
        </select>
    </div>

    <div class="form-group campo-motor" id="grupo-fase" style="display: none;">
        <label for="fase">Tipo de Alimentação do Motor</label>
        <select id="fase">
            <option value="monofasico">Monofásico / Bifásico</option>
            <option value="trifasico">Trifásico (√3)</option>
        </select>
    </div>

    <div class="form-group">
        <label id="label-quantidade" for="quantidade">Qtd. de Lâmpadas:</label>
        <input type="number" id="quantidade" min="1" value="1" required>
    </div>

    <div class="form-group">
        <label id="label-potencia" for="potencia">Potência das Lâmpadas (W):</label>
        <input type="number" id="potencia" min="1" placeholder="Ex: 100" required>
    </div>

    <div class="form-group campo-motor" id="grupo-fp" style="display: none;">
        <label for="fp">Fator de Potência (cos φ)</label>
        <input type="number" id="fp" min="0.1" max="1" step="0.01" value="0.85">
    </div>

    <div class="form-group">
        <label for="voltagem">Tensão Elétrica (V)</label>
        <select id="voltagem">
            <option value="127">127 V</option>
            <option value="220" selected>220 V</option>
            <option value="240">240 V</option>
            <option value="380">380 V</option>
            <option value="440">440 V</option>
        </select>
    </div>

    <div class="btn-group">
        <button class="btn-calc" onclick="calcular()">Calcular Circuito</button>
        <button class="btn-clear" onclick="limparCampos()">🧹 Limpar</button>
    </div>

    
    <section class="result-box" id="resultado" style="display: none;" aria-live="polite">
        <div class="result-row">
            <span class="result-label">Carga total informada:</span>
            <span class="result-value" id="res-carga">0W</span>
        </div>
        <div class="result-row">
            <span class="result-label">Corrente Corrigida:</span>
            <span class="result-value highlight" id="res-corrente">0.00 A</span>
        </div>
        <div class="result-row" style="margin-top: 10px; border-top: 1px solid #334155; padding-top: 15px;">
            <span class="result-label" style="color: #ffffff; font-weight: 600;">Bitola Comercial do Cabo:</span>
            <span class="cable-badge" id="res-cabo">-</span>
        </div>
        
        <button class="btn-copy" onclick="copiarTexto()">📋 Copiar Resumo para o Cliente</button>
    </section>
</main>

<script>
    let textoCopia = "";

    function alternarCampos() {
        const tipo = document.getElementById('tipo').value;
        const grupoFp = document.getElementById('grupo-fp');
        const groupFase = document.getElementById('grupo-fase');
        const labelPotencia = document.getElementById('label-potencia');
        const labelQuantidade = document.getElementById('label-quantidade');
        const inputQuantidade = document.getElementById('quantidade');
        const inputPotencia = document.getElementById('potencia');

        document.getElementById('resultado').style.display = 'none';
        
        inputQuantidade.value = "1";
        inputPotencia.value = ""; 
        document.getElementById('fp').value = "0.85";
        document.getElementById('fase').value = "monofasico";
        document.getElementById('voltagem').value = "220";

        if (tipo === 'motor') {
            grupoFp.style.display = 'block';
            groupFase.style.display = 'block';
            labelPotencia.innerText = "Potência do Motor (cv):";
            labelQuantidade.innerText = "Qtd. de Motores:";
            inputPotencia.placeholder = "Ex: 2";
        } else {
            grupoFp.style.display = 'none';
            groupFase.style.display = 'none';
            if (tipo === 'chuveiro') {
                labelPotencia.innerText = "Potência do Chuveiro (W):";
                labelQuantidade.innerText = "Qtd. de Chuveiros:";
                inputPotencia.placeholder = "Ex: 5500";
            } else {
                labelPotencia.innerText = "Potência das Lâmpadas (W):";
                labelQuantidade.innerText = "Qtd. de Lâmpadas:";
                inputPotencia.placeholder = "Ex: 100";
            }
        }
    }

    function limparCampos() {
        document.getElementById('tipo').value = "lampada";
        alternarCampos();
    }

    function calcular() {
        const tipo = document.getElementById('tipo').value;
        const q = parseInt(document.getElementById('quantidade').value);
        const p = parseInt(document.getElementById('potencia').value);
        const v = parseInt(document.getElementById('voltagem').value);
        const fp = parseFloat(document.getElementById('fp').value);
        const fase = document.getElementById('fase').value;

        if (isNaN(q) || isNaN(p)) {
            alert("Por favor, insira valores válidos.");
            return;
        }

        let s = 0;
        if (tipo === 'motor') {
            const potenciaEmWatts = p * 735.5;

            if (fase === 'trifasico') {
                s = (q * potenciaEmWatts) / (v * fp * 1.73205);
            } else {
                s = (q * potenciaEmWatts) / (v * fp);
            }
        } else {
            s = (q * p) / v;
        }

        let bitola = "";
        if (s >= 0 && s < 15) bitola = "1,5 mm²";
        else if (s >= 15 && s < 21) bitola = "2,5 mm²";
        else if (s >= 21 && s < 28) bitola = "4,0 mm²";
        else if (s >= 28 && s < 36) bitola = "6,0 mm²";
        else if (s >= 36 && s < 50) bitola = "10,0 mm²";
        else if (s >= 50 && s < 68) bitola = "16,0 mm²";
        else if (s >= 68 && s < 89) bitola = "25,0 mm²";
        else if (s >= 89 && s < 112) bitola = "35,0 mm²";
        else if (s >= 112 && s < 138) bitola = "50,0 mm²";
        else if (s >= 138 && s < 176) bitola = "70,0 mm²";
        else if (s >= 176 && s < 210) bitola = "95,0 mm²";
        else if (s >= 210 && s < 240) bitola = "120,0 mm²";
        else if (s >= 240 && s < 274) bitola = "150,0 mm²";
        else if (s >= 274 && s < 312) bitola = "185,0 mm²";
        else if (s >= 312 && s < 361) bitola = "240,0 mm²";
        else bitola = "300 mm²";

        if (tipo === 'chuveiro' && bitola === "1,5 mm²") {
            bitola = "2,5 mm²";
        }

        let labelTipo = document.getElementById('tipo').options[document.getElementById('tipo').selectedIndex].text;
        let infoAdicional = "";
        if (tipo === 'motor') {
            infoAdicional = fase === 'trifasico' ? " (Trifásico)" : " (Monofásico/Bifásico)";
        }

        const potenciaTotalWatts = (tipo === 'motor') ? (q * p * 735.5) : (q * p);
        const potenciaUnitariaWatts = (tipo === 'motor') ? (p * 735.5) : p;

        document.getElementById('res-carga').innerText = `${q}x ${potenciaUnitariaWatts.toFixed(0)}W (${potenciaTotalWatts.toFixed(0)}W Total)`;
        document.getElementById('res-corrente').innerText = `${s.toFixed(2)} A`;
        document.getElementById('res-cabo').innerText = bitola;

        const infoCv = (tipo === 'motor') ? ` (${q * p}cv)` : '';
        
        textoCopia = `⚡ *Dimensionamento Técnico*\n` +
                     `• Carga: ${labelTipo}${infoAdicional}\n` +
                     `• Potência Total: ${potenciaTotalWatts.toFixed(0)}W${infoCv}\n` +
                     `• Tensão: ${v}V\n` +
                     `• Corrente Calculada: ${s.toFixed(2)}A\n` +
                     `▶️ *Cabo Recomendado: ${bitola}*\n` +
                     `_(Cálculo de referência baseado na NBR 5410)_`;

        document.getElementById('resultado').style.display = 'block';
    }

    function copiarTexto() {
        navigator.clipboard.writeText(textoCopia).then(() => {
            alert("Resumo copiado com sucesso! Pronto para colar no WhatsApp.");
        }).catch(() => {
            alert("Erro ao copiar automaticamente. Selecione e copie o resultado.");
        });
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
            .then(() => console.log('PWA Pronto!'))
            .catch((err) => console.log('Erro PWA:', err));
    }
</script>

</body>
</html>
